name: Update VRT Baselines

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Render & commit VRT baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build tokens
        run: npm run tokens

      - name: Build Storybook
        run: npm run build-sb

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate baselines
        run: npx playwright test --update-snapshots
        env:
          CI: true
        continue-on-error: true

      - name: Commit baselines back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/
          git diff --cached --quiet && echo "No new snapshots" && exit 0
          git commit -m "ci: update VRT baselines [skip ci]"
          git pull --rebase origin main
          git push
